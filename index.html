<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3EFE6">
<title>Rahul &amp; Arya — the invitation, alive</title>

<!--
  FONTS
  Swap these two lines (and js/config.js -> FONTS) when the final display font
  arrives. If you get a .woff2 file, drop it in assets/fonts/ and use the
  @font-face block in css/style.css instead of this link.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@600;700&family=Modak&family=Patrick+Hand&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=60">
</head>
<body>

<!-- The whole 2D film is drawn here, then used as a texture on the AR plane. -->
<canvas id="stage"></canvas>

<!-- AR scene is injected here by js/main.js (skipped in ?preview mode) -->
<div id="ar-root"></div>

<div id="overlay">
  <div id="loader">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loader-text">Loading the story…</p>
  </div>

  <div id="hint" hidden>
    <p class="hint-title" id="hint-title">Point your camera at the invitation</p>
    <p class="hint-sub" id="hint-sub">Hold the card flat and fill about half the screen.</p>
  </div>

  <!--
    DRAG TO TRAVEL — screen UI, not AR.
    This card lives in the page, fixed to the bottom of the viewport. It is
    deliberately OUTSIDE #ar-root: it is not an a-entity, it carries no
    marker transform, and it is painted by the browser rather than onto any
    of the four diorama canvases. So it holds still while the film moves
    with the card on the table. Dragging the plane here releases the
    director's next gate, which is what advances the AR.
  -->
  <div id="travel" hidden>
    <p class="travel-title">DRAG TO TRAVEL <span class="travel-arrow" aria-hidden="true">&#8594;</span></p>
    <div class="travel-track" id="travel-track">
      <div class="travel-line" aria-hidden="true"></div>
      <div class="travel-fill" id="travel-fill" aria-hidden="true"></div>
      <div class="travel-dots" id="travel-dots" aria-hidden="true"></div>
      <img class="travel-plane" id="travel-plane" src="assets/icons/airplane.png"
           alt="" draggable="false">
    </div>
    <ul class="travel-labels" id="travel-labels">
      <li>SEINE</li><li>LOUVRE</li><li>EIFFEL</li>
    </ul>
  </div>

  <div id="error" hidden>
    <p class="hint-title">Camera unavailable</p>
    <p class="hint-sub" id="error-sub">Allow camera access, or open this page over https:// to try again.</p>
    <button id="preview-btn" type="button">Watch without the card</button>
  </div>
</div>

<!--
  Cache-busting: plain <script src> tags with no query string can get stuck
  in a browser's disk cache, silently serving an old copy of a file across
  reloads even after it changes on disk (a normal reload isn't guaranteed to
  revalidate them). Bump this version string any time a JS edit doesn't
  seem to show up in the preview — a mismatched number is a much more
  reliable fix than asking for a hard refresh.
-->
<script src="js/config.js?v=59"></script>
<script src="js/engine.js?v=59"></script>
<script src="js/scenes.js?v=59"></script>
<script src="js/main.js?v=59"></script>
</body>
</html>
